name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Electron のバイナリ（100MB超）はテストに要らないので postinstall を飛ばす。
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
